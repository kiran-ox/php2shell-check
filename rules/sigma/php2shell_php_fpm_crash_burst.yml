title: PHP-FPM Worker Crash Burst
id: e9e41b1f-c623-4713-8a15-d42c384810f6
status: experimental
description: |
    Five or more PHP-FPM crash or pre-script out-of-memory events within ten minutes. Exploiting the PHP2Shell bugs
    (CVE-2026-109618, CVE-2026-109619) takes many attempts against workers, so such bursts are a strong signal.
    Add group-by on the field that holds the host name in your pipeline so bursts are counted per server.
references:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
author: OX Security
date: 2026-10-21
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2026-109618
    - cve.2026-109619
correlation:
    type: event_count
    rules:
        - php2shell_php_fpm_crash
    # group-by:
    #     - host
    timespan: 10m
    condition:
        gte: 5
falsepositives:
    - A PHP extension that crashes repeatedly under normal load
level: high
