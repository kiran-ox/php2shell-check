name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  lint:
    name: shellcheck and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh -S warning php2shell-check.sh tests/run.sh
      - name: Validate data/php2shell.json
        run: |
          jq -e 'type == "object"' data/php2shell.json > /dev/null
          echo "data/php2shell.json is valid JSON"

  tests-ubuntu:
    name: tests (ubuntu, sh/dash/bash/busybox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash busybox jq
      - name: Run tests
        run: sh tests/run.sh

  tests-macos:
    name: tests (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: sh tests/run.sh

  tests-distro:
    name: tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - alpine:3.20
          - rockylinux/rockylinux:9
          - amazonlinux:2023
    env:
      IMG: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests inside the container
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMG" sh -c '
            set -e
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq gzip findutils procps
            elif command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq jq gzip findutils procps
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y -q jq gzip findutils procps-ng
            elif command -v yum >/dev/null 2>&1; then
              yum install -y -q jq gzip findutils procps-ng
            fi
            sh tests/run.sh
          '

  real-php-images:
    name: offline scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php:8.4.26-cli
            verdict: VULNERABLE
            reason: below-fixed-version
            evidence: ''
            optional: 'false'
          - image: php:8.1-cli
            verdict: VULNERABLE
            reason: eol-no-upstream-fix
            evidence: ''
            optional: 'false'
          - image: php:7.4-cli
            verdict: VULNERABLE
            reason: eol
            evidence: ''
            optional: 'false'
          - image: php:8.4.27-cli
            verdict: FIXED
            reason: ''
            evidence: fingerprint
            optional: 'true'
          - image: php:8.5.12-cli
            verdict: FIXED
            reason: ''
            evidence: fingerprint
            optional: 'true'
    env:
      IMG: ${{ matrix.image }}
      EXP_VERDICT: ${{ matrix.verdict }}
      EXP_REASON: ${{ matrix.reason }}
      EXP_EVIDENCE: ${{ matrix.evidence }}
      OPTIONAL: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the extracted image offline
        run: |
          set -eu
          # "docker manifest inspect" succeeds even for an empty manifest list,
          # so whether the image exists is decided by pulling it.
          if ! docker pull -q "$IMG" > /dev/null 2>&1; then
            if [ "$OPTIONAL" = true ]; then
              echo "::notice::$IMG could not be pulled (not published yet?); skipping"
              exit 0
            fi
            echo "::error::$IMG could not be pulled"
            exit 1
          fi
          D=$(mktemp -d)
          # Container names need at least two characters.
          C="p2s-scan-$(printf '%s' "$IMG" | tr -c 'A-Za-z0-9_.-' '-')"
          docker create --name "$C" "$IMG" > /dev/null
          docker export "$C" | sudo tar -x -C "$D"
          docker rm "$C" > /dev/null
          rc=0
          sh php2shell-check.sh --root "$D" --json --skip-ioc > r.json || rc=$?
          echo "exit code: $rc"
          if [ $((rc & 64)) -ne 0 ]; then echo "::error::usage error"; exit 1; fi
          jq '.installations' r.json
          jq -e --arg v "$EXP_VERDICT" --arg r "$EXP_REASON" --arg e "$EXP_EVIDENCE" '
            [ .installations[]
              | select(.path | endswith("/usr/local/bin/php"))
              | select(.verdict == $v)
              | select($r == "" or (.reason | startswith($r)))
              | select($e == "" or .evidence == $e)
            ] | length >= 1
          ' r.json > /dev/null
          if [ "$EXP_VERDICT" = VULNERABLE ]; then
            jq -e '.summary.verdict == "VULNERABLE"' r.json > /dev/null
            [ $((rc & 1)) -ne 0 ] || { echo "::error::exit code lacks the vulnerable bit"; exit 1; }
          fi
          echo "$IMG: OK"

  live-container:
    name: live container detection (php-fpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start a vulnerable php-fpm container
        run: |
          docker run -d --name fpm php:8.4.26-fpm
          i=0
          until docker top fpm 2>/dev/null | grep -q 'php-fpm'; do
            i=$((i + 1)); [ "$i" -le 30 ] || { docker logs fpm; exit 1; }
            sleep 1
          done
          docker top fpm
      - name: Scan the host
        run: |
          set -eu
          rc=0
          # The report is written as the runner user on purpose.
          # shellcheck disable=SC2024
          sudo sh php2shell-check.sh --json --skip-ioc > r.json || rc=$?
          echo "exit code: $rc"
          if [ $((rc & 64)) -ne 0 ]; then echo "::error::usage error"; exit 1; fi
          jq '[.installations[] | select(.scope | startswith("container:"))]' r.json
          jq -e '
            [ .installations[]
              | select(.scope | startswith("container:"))
              | select(.sapi == "fpm")
              | select(.running.processes >= 1)
              | select(.verdict == "VULNERABLE")
            ] | length >= 1
          ' r.json > /dev/null
          echo "live container detection: OK"
      - name: Clean up
        if: always()
        run: docker rm -f fpm || true
